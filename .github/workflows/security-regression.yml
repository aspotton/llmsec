name: Security regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run fast security regressions
        run: pytest -m security
      # GITHUB_BASE_REF (branch NAME, PR events only) resolved to a SHA; without
      # this the shallow checkout lacks base objects and the runner loud-fails.
      - name: Resolve adaptive gate base ref
        run: |
          BASE="${GIT_BASE_REF:-${GITHUB_BASE_REF:-main}}"
          git fetch --no-tags origin "$BASE"
          echo "GIT_BASE_REF=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Run adaptive eval gate
        run: PYTHONPATH=src python3 evals/run_adaptive.py --gate

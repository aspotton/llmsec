[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsec"
version = "0.1.0"
description = "A local-first, low-latency security runtime for LLM applications."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "llmsec contributors" }
]
keywords = ["llm", "security", "guardrails", "prompt-injection", "rag", "ai-security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=9.1.1",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]
onnx = [
  "onnxruntime>=1.20",
]

[project.scripts]
llmsec = "llmsec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "security: fast security regression tests",
  "integration: integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llmsec"]
mypy_path = "src"
warn_unused_configs = true

[tool.uv]
default-groups = []
